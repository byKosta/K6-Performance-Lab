apiVersion: 1

datasources:
  - name: InfluxDB_k6
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    orgId: 1
    isDefault: true
    jsonData:
      version: Flux                  # Flux — обязательно
      organization: grafana
      defaultBucket: k6
      httpHeaderName1: Authorization
    secureJsonData:
      httpHeaderValue1: Token my-super-secret-token-2025   # токен из docker-compose