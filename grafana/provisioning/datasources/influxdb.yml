apiVersion: 1

datasources:
  - name: InfluxDB_k6
    type: influxdb
    access: proxy
    orgId: 1
    url: http://influxdb:8086
    user: grafana
    password: grafana
    secureJsonData:
      token: my-super-secret-token-2025
      httpHeaderValue1: Token my-super-secret-token-2025
    jsonData:
      version: Flux
      organization: grafana
      defaultBucket: k6
      httpHeaderName1: Authorization
    isDefault: true